[project]
name = "rag"
version = "0.1.0"
description = "RAG against the machine - 42 Common Core - Milestone 4 "
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.9",
    "chromadb>=1.5.9",
    "dspy>=3.2.0",
    "fire>=0.7.1",
    "langchain>=1.2.17",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.3",
    "sentence-transformers>=5.5.1",
]

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]
